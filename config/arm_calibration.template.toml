# 仅在完成实物测量后复制为 arm_calibration.toml。
# 此模板故意不可直接执行：以下数值全部只是占位符。

[arm]
axis_count = 6
position_unit = "TODO: servo-count or calibrated-radian"

[[axis]]
name = "joint_1"
servo_id = -1
direction = 0
zero_count = -1
safe_min = -1
safe_max = -1

# 按相同字段补充其余五个经测量的关节表。

[bus]
baud = 1000000
data_bits = 8
parity = "none"
stop_bits = 1
sync_read_verified = false

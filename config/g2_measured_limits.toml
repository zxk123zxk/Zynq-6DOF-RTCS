# 2026-10-08，用户在安装状态下逐轴实测；安全范围两端均包含。
# 原始 count 只用于 G2 总线命令。关节方向未给出，不从范围方向推算角度符号。
[arm]
axis_count = 6
position_unit = "servo_count"
measured_reference_pose_count = [2000, 861, 3117, 2861, 2000, 1585]
# 这不是安全回位姿态：ID 2/6 在下限，ID 3/4 在上限。
# safe_return_pose_count 尚未实测，软件无自动回位命令。
counts_per_90_degrees_approx = 1000

[motion]
speed_raw_max = 1500
speed_raw_recommended = 500
calibrate_time_raw = 10

[[axis]]
servo_id = 1
reference_position = 2000
safe_min = 1000
safe_max = 3000

[[axis]]
servo_id = 2
reference_position = 861
safe_min = 861
safe_max = 1500

[[axis]]
servo_id = 3
reference_position = 3117
safe_min = 2000
safe_max = 3117

[[axis]]
servo_id = 4
reference_position = 2861
safe_min = 2000
safe_max = 2861

[[axis]]
# 2026-10-12 操作者报告已用官方软件重新校准 ID 5，并认可 0..4000 作为命令范围。
# 这不是机械全行程的实测安全区间；具体 G3 工位路径仍须逐步现场确认。
# 旧窄窗口根因与尚缺的写后原始记录见 docs/2.G2-six-axis-calibration.md。
servo_id = 5
reference_position = 2000
safe_min = 0
safe_max = 4000

[[axis]]
# ID 6 = 夹爪执行器（用户 2026-10-12 确认）。下面 1585..2500 是其命令闭区间标注，
# "开"与"合"对应的原始 count 方向与两端值须由 G3 步骤 1 实测确认后补记。
# 夹爪与 ID 1–5 共用同一条六轴广播命令，不为它另建旁路。
servo_id = 6
reference_position = 1585
safe_min = 1585
safe_max = 2500
